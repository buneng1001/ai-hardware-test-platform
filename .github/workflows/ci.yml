name: CI

on:
  push:
  pull_request:

jobs:
  database-migrations:
    runs-on: ubuntu-latest
    env:
      APP_DATA_DIR: data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装后端依赖
        run: python -m pip install -e "./backend[dev]"
      - name: 空数据库迁移与恢复验收
        run: python -m pytest backend/tests/test_database_migrations.py -q

  v020-fixed-sample-api:
    runs-on: ubuntu-latest
    env:
      AI_DIAGNOSIS_MODE: "mock"
      APP_DATA_DIR: data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装后端依赖
        run: python -m pip install -e "./backend[dev]"
      - name: 固定样例公开 API 黄金路径
        run: python -m pytest backend/tests/test_v020_fixed_sample_acceptance.py -q
      - name: v0.2.0 领域契约回归
        run: |
          python -m pytest \
            backend/tests/test_project_workspace_api.py \
            backend/tests/test_source_test_case_imports_api.py \
            backend/tests/test_automation_case_conversion_api.py \
            backend/tests/test_automation_execution_api.py \
            backend/tests/test_manual_test_results_api.py \
            backend/tests/test_report_api.py \
            backend/tests/test_report_lifecycle_api.py \
            backend/tests/test_disabled_case_services.py -q

  full-regression:
    runs-on: ubuntu-latest
    env:
      AI_DIAGNOSIS_MODE: "mock"
      APP_DATA_DIR: data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: 安装后端依赖
        run: python -m pip install -e "./backend[dev]"
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
      - name: 后端完整测试与格式检查
        run: |
          python -m pytest backend/tests --alluredir=tmp/ticket20-acceptance/allure-results
          python -m ruff check backend
          python -m ruff format --check backend
      - name: 公开 API 主 seam 与 Mock 验收
        run: |
          python scripts/run_ticket20_acceptance.py --output tmp/ticket20-acceptance
          python scripts/check_artifact_safety.py tmp/ticket20-acceptance
      - name: v0.2.0 前端关键组件、类型与生产构建
        run: |
          pnpm --dir frontend test -- \
            src/ProjectWorkspace.test.tsx \
            src/AutomationTestCasesPanel.test.tsx \
            src/ManualTestResultsPanel.test.tsx \
            src/FactReportPanel.test.tsx \
            src/ProjectTrendPanel.test.tsx
          pnpm test
          pnpm typecheck
          pnpm format:check
          pnpm --dir frontend build
      - name: 仓库安全扫描
        run: python scripts/check_repository_safety.py
      - name: 上传 Allure 与验收证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ticket20-allure-and-acceptance
          path: tmp/ticket20-acceptance
          if-no-files-found: error
