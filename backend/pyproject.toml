[project]
name = "hardware-test-platform-api"
version = "0.1.0"
description = "智能硬件测试执行与诊断平台后端"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.116.1",
    "imageio-ffmpeg==0.6.0",
    "openpyxl==3.1.5",
    "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.1",
    "ruff==0.12.9",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
